name: Build Android + iOS
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          cd android && chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            # Errores de Kotlin como anotaciones (legibles por la API de GitHub)
            grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | sort -u | head -n 45 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AirMix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: AirMix.apk
      - name: Capturas (celular y tablet, Robolectric)
        continue-on-error: true
        run: |
          cd android
          ./gradlew testDebugUnitTest --tests '*ScreensTest*' > test.log 2>&1 || (tail -n 80 test.log; grep -E "^e: |Exception|at ar\.joaquin" test.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -n 30 | while IFS= read -r l; do echo "::warning::$l"; done)
          mkdir -p ../screens && for f in app/build/screens/*.png; do cp "$f" "../screens/android-$(basename "$f")"; done; ls ../screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens-android
          path: screens/*.png
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      # CFBundleVersion = número de build del CI (tag build-NN): el aviso de actualización compara contra eso.
      - run: sed -i '' -E 's/CFBundleVersion: "[0-9]+"/CFBundleVersion: "${{ github.run_number }}"/' ios/project.yml
      - run: cd ios && xcodegen generate
      - name: Compilar (sin firmar)
        run: |
          cd ios
          set +e
          xcodebuild -project AirMix.xcodeproj -scheme AirMix -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            # Errores como anotaciones (legibles por la API de GitHub)
            grep -E "error:" build.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -n 45 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code
      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/AirMix.app Payload/
          zip -qr AirMix-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: AirMix-unsigned.ipa
      - name: Capturas (iPhone y iPad, simulador)
        continue-on-error: true
        run: |
          cd ios
          xcodebuild -project AirMix.xcodeproj -scheme AirMix -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { tail -n 30 sim.log; exit 1; }
          APP=simbuild/Build/Products/Debug-iphonesimulator/AirMix.app
          mkdir -p ../screens
          shoot() {
            NAME=$1; TYPE=$2
            UDID=$(xcrun simctl create "$NAME" "$TYPE") || return 0
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl install "$UDID" "$APP"
            for S in mezcla notas link config favoritos linecheck reloj efectos corte; do
              xcrun simctl launch "$UDID" ar.joaquin.airmix -ip 10.255.255.1 -debugScreen "$S" > /dev/null
              sleep 7
              xcrun simctl io "$UDID" screenshot "../screens/ios-$NAME-$S.png"
              xcrun simctl terminate "$UDID" ar.joaquin.airmix || true
            done
            xcrun simctl shutdown "$UDID" || true
          }
          PHONE=$(xcrun simctl list devicetypes | grep -E "^iPhone 1[5-7] Pro \(" | head -n 1 | sed -E 's/ \(.*//')
          PAD=$(xcrun simctl list devicetypes | grep -E "^iPad Air 11-inch|^iPad \(" | head -n 1 | sed -E 's/ \(com.*//')
          echo "Celular: $PHONE / Tablet: $PAD"
          shoot celular "$PHONE"
          shoot tablet "$PAD"
          ls ../screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens-ios
          path: screens/*.png
          if-no-files-found: ignore

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      # La web de Claraboya lee el número de versión del nombre del Release ("AirMix 0.5.1 · build N")
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: android/app/build.gradle.kts
          sparse-checkout-cone-mode: false
      - name: Leer versión
        id: ver
        run: |
          V=$(grep -oE 'versionName *= *"[^"]+"' src/android/app/build.gradle.kts | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "version=${V:-0.0.0}" >> "$GITHUB_OUTPUT"
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AirMix ${{ steps.ver.outputs.version }} · build ${{ github.run_number }}
          make_latest: true
          files: |
            android/AirMix.apk
            ios/AirMix-unsigned.ipa
            screens-android/*.png
            screens-ios/*.png
